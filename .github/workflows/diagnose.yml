name: Diagnose build

# Temporary: reports compiler/test output as a commit comment, because this workflow's owner cannot
# download Actions logs or artifacts from the environment the branch is being edited in.
# Deleted once the branch is green.

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    name: Compile (app + androidTest) and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run the JVM tests, keeping the output
        run: |
          set +e
          ./gradlew --no-daemon --console=plain :app:compileDebugJavaWithJavac :app:testDebugUnitTest \
            :app:compileDebugAndroidTestJavaWithJavac > /tmp/build.log 2>&1
          echo "gradle exit: $?" >> /tmp/build.log
          {
            echo "### Compile + JVM"
            echo '```'
            grep -nE "error:|FAILED|What went wrong|BUILD (FAILED|SUCCESSFUL)|tests completed" /tmp/build.log | head -60
            tail -c 12000 /tmp/build.log
            echo '```'
          } > /tmp/comment.md
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(head -c 60000 /tmp/comment.md)" --jq '.id' || true
        env:
          GH_TOKEN: ${{ github.token }}

  device:
    name: Emulator run, report failures
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the device tests
        id: device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest > /tmp/device.log 2>&1
            echo "gradle exit: $?" >> /tmp/device.log
      - name: Report device results
        if: always()
        run: |
          set +e
          {
            echo "### Emulator run"
            echo "device step: ${{ steps.device.outcome }}"
            echo '#### failing cases'
            echo '```'
            for f in $(find app/build/outputs/androidTest-results -name '*.xml' 2>/dev/null); do
              grep -h -A10 '<failure\|<error' "$f"
            done | head -c 26000
            echo '```'
            echo '#### suites'
            echo '```'
            for f in $(find app/build/outputs/androidTest-results -name '*.xml' 2>/dev/null); do
              grep -h '<testsuite ' "$f"
            done | head -30
            echo '```'
            echo '#### gradle'
            echo '```'
            grep -E 'FAILED|tests completed|gradle exit|Exception|BUILD ' /tmp/device.log | head -50
            tail -c 9000 /tmp/device.log
            echo '```'
          } > /tmp/comment.md
          head -c 60000 /tmp/comment.md
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(head -c 60000 /tmp/comment.md)" --jq '.id'
        env:
          GH_TOKEN: ${{ github.token }}
